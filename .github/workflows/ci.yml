name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python bağımlılıkları (kilit dosyası güncel olmalı)
        run: uv sync --locked

      - name: Kod denetimi
        run: uv run python -m ruff check .

      - name: Arayüz bağımlılıkları
        run: npm --prefix web ci --no-fund --no-audit

      - name: Arayüz kod denetimi (eslint)
        run: npm --prefix web run lint

      - name: Arayüz birim testleri (vitest)
        run: npm --prefix web test

      - name: Arayüzü derle (tür denetimi dahil)
        run: npm --prefix web run build

      # Edge çalıştırıcıda hazır: Markdown/HTML baskısı ve arayüz testleri koşar. LibreOffice,
      # Tesseract ve Ghostscript kurulu değil: onları isteyen testler atlanır.
      - name: Testler
        run: uv run python -m pytest --tb=short -rs

  # Bilinen açık taraması (GUVENLIK_PLANI.md, adım 6): Python bağımlılıkları (kilit dosyasından)
  # ve arayüzün pakete giren çalışma bağımlılıkları. Yeni bir açık yayımlanınca bu iş kırmızı
  # olur: ilgili sürümü yükselt. Geliştirme araçları (eslint...) pakete girmez, yalnızca raporlanır.
  guvenlik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Python bağımlılık açıkları (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --no-hashes > req.txt
          uvx pip-audit@2.10.1 -r req.txt --no-deps --disable-pip --progress-spinner off

      - name: Arayüz çalışma bağımlılıkları (npm audit)
        run: npm --prefix web audit --omit=dev --audit-level=moderate

      - name: Arayüz geliştirme araçları (yalnızca rapor)
        run: npm --prefix web audit || true

  # Linux'ta kaynak koddan çalıştırma (masaüstü paketi yalnızca Windows). Motorlar dağıtımın
  # paketlerinden; tarayıcı çalıştırıcıdaki Google Chrome.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Motorlar (LibreOffice, Tesseract + Türkçe, Ghostscript)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-tur             tesseract-ocr-eng ghostscript libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Python bağımlılıkları
        run: uv sync --locked

      - name: Arayüzü derle
        run: |
          npm --prefix web ci --no-fund --no-audit
          npm --prefix web run build

      - name: Motor durumu
        run: uv run python -m toolia motorlar

      - name: Testler
        run: uv run python -m pytest --tb=short -rs

  # LaTeX → PDF: gerçek derleme testleri yalnız TeX kuruluyken koşar; öbür işlerde atlanır.
  # TeX Live dağıtımın paketlerinden (önerilen paketler olmadan: default-jre gibi ağır
  # bağımlılıklar gelmesin; gerekenler açıkça yazıldı). Ghostscript EPS testleri için.
  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: TeX Live (pdflatex, xelatex, lualatex, biber) ve Ghostscript
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-extra \
            texlive-xetex texlive-luatex texlive-lang-european biber cm-super ghostscript \
            texlive-bibtex-extra texlive-fonts-recommended texlive-plain-generic lmodern

      - name: Python bağımlılıkları
        run: uv sync --locked

      # `motorlar` burada 1 döner (LibreOffice/Tesseract kurulmadı); yalnız LaTeX'in
      # bulunduğu denetlenir, yoksa derleme testleri sessizce atlanırdı.
      - name: LaTeX bulundu mu
        run: |
          uv run python -m toolia motorlar || true
          uv run python -c "from toolia import engines; p = engines.find_tex(); print(p); assert p, 'pdflatex yok'"

      - name: LaTeX testleri
        run: uv run pytest tests/test_latex.py tests/test_latex_cli.py -q --tb=short -rs

  # Masaüstü paketi (motorsuz: CI'da Tesseract/Ghostscript yok). Paket kendi Python'uyla
  # denenir (bağımlılıklar yükleniyor mu, arayüz ve fontlar pakette mi) ve artifact olarak
  # yüklenir. Arkadaşlara verilecek tam paket (OCR dahil) yerelde `paket/derle.py` ile üretilir.
  paket:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Arayüzü derle
        run: |
          npm --prefix web ci --no-fund --no-audit
          npm --prefix web run build

      - name: Paketi üret ve dene
        run: uv run python paket/derle.py --motorsuz

      - uses: actions/upload-artifact@v4
        with:
          name: Toolia-motorsuz
          path: |
            build/Toolia-*.zip
            build/Toolia-*.zip.sha256
          retention-days: 14

  # Linux masaüstü paketi (gömülü python-build-standalone 3.11 + bağımlılıklar + arayüz).
  # Geçici $HOME altında kur.sh ve kaldirma yolu da uçtan uca denenir.
  paket-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Arayüzü derle
        run: |
          npm --prefix web ci --no-fund --no-audit
          npm --prefix web run build

      - name: Linux paketini üret ve dene
        run: uv run python paket/derle.py --linux

      - name: Kurulum ve kaldırma denemesi (geçici HOME)
        run: |
          TMPHOME="$(mktemp -d)"
          WORK="$(mktemp -d)"
          tar -xzf build/Toolia-*-linux-x86_64.tar.gz -C "$WORK"
          PKG="$(find "$WORK" -maxdepth 1 -type d -name 'Toolia-*' | head -n 1)"
          HOME="$TMPHOME" DISPLAY="" WAYLAND_DISPLAY="" \
            TOOLIA_KURULUM_BEKLEME=0 TOOLIA_KURULUM_MOTOR_SORMA=0 \
            "$PKG/kur.sh"
          test -x "$TMPHOME/.local/bin/toolia"
          test -f "$TMPHOME/.local/share/applications/toolia.desktop"
          test -f "$TMPHOME/.local/share/icons/hicolor/256x256/apps/toolia.png"
          HOME="$TMPHOME" "$TMPHOME/.local/bin/toolia" --help >/dev/null
          HOME="$TMPHOME" "$TMPHOME/.local/opt/toolia/python/bin/python3" -I -c \
            "from pathlib import Path; from toolia import kurulum; \
             assert kurulum.uninstall(Path('$TMPHOME/.local/opt/toolia'), assume_yes=True, remove_data=False) == 0"
          test ! -e "$TMPHOME/.local/bin/toolia"
          test ! -e "$TMPHOME/.local/share/applications/toolia.desktop"
          rm -rf "$TMPHOME" "$WORK"

      - uses: actions/upload-artifact@v4
        with:
          name: Toolia-linux
          path: |
            build/Toolia-*-linux-x86_64.tar.gz
            build/Toolia-*-linux-x86_64.tar.gz.sha256
          retention-days: 14
